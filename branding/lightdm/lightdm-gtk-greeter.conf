[greeter]
background = /var/cache/hemo/login-bg.png
theme-name = Hemo-Greeter
icon-theme-name = Papirus-Dark
font-name = JetBrains Mono 11
xft-antialias = true
xft-hintstyle = hintfull
indicator = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %Y-%m-%d   %H:%M
position = 50%,center 55%,center
default-user-image = /usr/share/hemo/branding/hemo-login.png
