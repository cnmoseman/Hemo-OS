# Hemo — always-on kernel hardening (safe for an offensive ops box).
# These do NOT impede pentest/RE work. Aggressive net sysctls that WOULD fight
# MITM/relay (rp_filter, source-route/redirect drop) live in hemo-harden and are
# applied only when the operator runs `hemo-harden on`.
#
# Deliberately NOT set here:
#   kernel.yama.ptrace_scope  — would break gdb/pwndbg/strace against other procs
#   net.ipv4.conf.*.rp_filter — would break Responder/mitm6/bettercap relaying
#   net.ipv4.ip_forward       — pivoting/MITM needs it available on demand

# Hide kernel pointers and dmesg from unprivileged users (info-leak hardening).
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# Restrict loading of unprivileged BPF (common LPE surface); harmless for tooling.
kernel.unprivileged_bpf_disabled = 1

# Protect against hardlink/symlink TOCTOU races in world-writable dirs.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
