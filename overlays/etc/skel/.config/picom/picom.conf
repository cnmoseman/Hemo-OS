# Hemo picom — rounded corners, soft shadows, quick fades.
# xrender is the safe backend on VMware / virtio GPUs; try "glx" on real hardware.

backend = "xrender";
vsync = true;
# repaint the whole screen each frame: with partial ("damage") repaints, the
# VMware/virtio GPU leaves resized windows undrawn — e.g. when a new window
# makes autotiling resize the others, they turn see-through until hovered
use-damage = false;

corner-radius = 8;

shadow = true;
shadow-radius = 14;
shadow-offset-x = -10;
shadow-offset-y = -8;
shadow-opacity = 0.45;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;


rules = (
  # polybar draws its own rounded corners; dock windows get no shadow/rounding
  { match = "window_type = 'dock' || window_type = 'desktop'";
    shadow = false; corner-radius = 0; },
  { match = "window_type = 'tooltip' || window_type = 'notification' || window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    corner-radius = 6; },
  # i3's own frames and the screenshot selector stay square and shadowless
  { match = "class_g = 'i3-frame' || class_g = 'flameshot' || class_g = 'maim'";
    shadow = false; corner-radius = 0; fade = false; },
);
