# Hemo — kitty terminal.
# Deterministic sizing: the window opens at the SAME size every launch, so
# every terminal screenshot comes out at identical dimensions for reports.

font_family        JetBrains Mono
bold_font          auto
italic_font        auto
font_size          11.0
adjust_line_height  0

# Fixed geometry on every launch (the key to consistent screenshots).
# Sizes are in cells (c), so the pixel size is identical given the fixed font.
remember_window_size   no
initial_window_width   110c
initial_window_height  32c
window_padding_width   10 14
hide_window_decorations yes
confirm_os_window_close 0

# Hemo palette — dark swamp with a gold accent.
background            #221d19
foreground            #e8dfd4
cursor                #e9c24a
cursor_text_color     #221d19
selection_background  #3f372f
selection_foreground  #e8dfd4
url_color             #e9c24a

# 16-color terminal palette
color0  #282828
color8  #928374
color1  #cc241d
color9  #fb4934
color2  #98971a
color10 #b8bb26
color3  #d79921
color11 #fabd2f
color4  #458588
color12 #83a598
color5  #b16286
color13 #d3869b
color6  #689d6a
color14 #8ec07c
color7  #a89984
color15 #ebdbb2

# Scrollbar: always shown on the right edge whenever there is scrollback, so you
# can see where you are and drag back through output. Its colors follow the
# foreground, so it matches every Hemo mode/accent without hemo-role-apply.
scrollbar                     always
scrollbar_width               0.5
scrollbar_hover_width         1
scrollbar_handle_opacity      0.55
scrollbar_track_opacity       0.08
scrollbar_track_hover_opacity 0.15

scrollback_lines      10000
enable_audio_bell     no
background_opacity     1.0
