# Hemo — GTK3 look under i3 (no settings daemon, so GTK reads this directly).
# Dark Adwaita (built into GTK3, no extra package) + the Hemo palette in gtk.css.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Flat-Remix-Orange-Dark
gtk-font-name=Sans 10
gtk-button-images=1
gtk-menu-images=1
