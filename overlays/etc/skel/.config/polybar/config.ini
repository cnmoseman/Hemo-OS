; Hemo polybar — a slim floating bar: workspaces + window title (left), clock
; (centre), system + tray (right). Hemo palette; `accent` is rewritten per role.

[colors]
background = #1b1714
surface    = #2c2621
foreground = #e8dfd4
accent     = #c9a37a
moss       = #74a56e
blood      = #c41e2f
muted      = #a39686
; focused workspace tile — set per mode by hemo-role-apply
focus-bg   = #2c2621
focus-fg   = #c9a37a

[bar/main]
; floats 6px in from the edges with rounded corners. polybar places itself
; (override-redirect) because i3 would stretch a docked bar to full width; the
; space under it is kept by `gaps top` in i3/config.d/hemo-look.conf — keep
; that equal to height + offset-y.
width = 100%:-12
height = 30
offset-x = 6
offset-y = 6
radius = 8
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
padding-left = 1
padding-right = 2
module-margin = 1
separator = "%{F#3f372f}|%{F-}"
separator-foreground = ${colors.muted}
; one Nerd Font carries both text and icon glyphs
font-0 = JetBrainsMono Nerd Font Mono:style=Medium:size=10;2
font-1 = JetBrainsMono Nerd Font Mono:size=20;5
; fallback for symbols the Nerd Font lacks (e.g. in window titles)
font-2 = DejaVu Sans:size=10;2
; the Hemo head logo, as glyph U+E001 (built by branding/build-glyph-font.sh)
font-3 = Hemo Glyphs:size=25;4
; the power button, a touch larger than the other icons
font-4 = JetBrainsMono Nerd Font Mono:size=19;5
modules-left = hemo i3 title
modules-center = date
modules-right = cpu memory target ipaddr egress tray power
cursor-click = pointer
enable-ipc = true
override-redirect = true
wm-restack = i3

[module/hemo]
type = custom/text
format = "%{T4}%{T-}"
format-foreground = ${colors.accent}
format-padding = 1
click-left = hemo-launcher &

[module/i3]
; requires polybar built with i3 support (Kali's package is)
type = internal/i3
pin-workspaces = true
strip-wsnumbers = false
enable-scroll = false
label-focused = %name%
label-focused-background = ${colors.focus-bg}
label-focused-foreground = ${colors.focus-fg}
label-focused-underline = ${colors.accent}
label-focused-padding = 2
label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2
label-urgent = %name%
label-urgent-foreground = ${colors.blood}
label-urgent-padding = 2
; shown while an i3 mode (e.g. resize) is active
label-mode = " %mode% "
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.background}
label-mode-padding = 1

[module/title]
type = internal/xwindow
label = %title:0:45:…%
label-foreground = ${colors.muted}
label-empty = ""

[module/cpu]
; click opens btop in a floating terminal
type = internal/cpu
interval = 3
format = %{A1:kitty --class hemo-float -e btop &:}%{F#c9a37a}%{T2}󰻠%{T-}%{F-} <label>%{A}
label = %percentage:2%%

[module/memory]
; click opens btop in a floating terminal
type = internal/memory
interval = 5
format = %{A1:kitty --class hemo-float -e btop &:}%{F#c9a37a}%{T2}󰍛%{T-}%{F-} <label>%{A}
label = %percentage_used:2%%

[module/target]
; current target from `hemo-target <ip>`, hidden when unset
; left-click: copy it · right-click: clear it
type = custom/script
exec = hemo-bar-ip target
interval = 2
format = %{A1:hemo-bar-ip copy-target &:}%{A3:hemo-target -c >/dev/null &:}%{F#c41e2f}%{T2}󰗝%{T-}%{F-} <label>%{A}%{A}
label = %output%

[module/egress]
; public (egress) IPv4, cached — see hemo-bar-ip · left-click: copy · right-click: re-check now
type = custom/script
exec = hemo-bar-ip egress
interval = 15
format = %{A1:hemo-bar-ip copy-egress &:}%{A3:hemo-bar-ip refresh-egress &:}%{F#c9a37a}%{T2}󰖟%{T-}%{F-} <label>%{A}%{A}
label = %output%

[module/ipaddr]
; one IP tile: the VPN/tunnel IP when connected, else the LAN IP (hemo-bar-ip ip).
; left-click: copy it · right-click: network/VPN manager (nm-connection-editor GUI). Theme-colored.
type = custom/script
exec = hemo-bar-ip ip
interval = 3
format = %{A1:hemo-bar-ip copy-ip &:}%{A3:nm-connection-editor &:}%{F#c9a37a}%{T2}󰈀%{T-}%{F-} <label>%{A}%{A}
label = %output%

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
format-prefix = "%{T2}󰥔%{T-} "
format-prefix-foreground = ${colors.accent}
label = %date%  %time%

; system tray — nm-applet (network/VPN), udiskie (automount), greenclip, etc.
[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 6px
tray-background = ${colors.background}

[module/power]
; left-click: power menu (hemo-power, also $mod+Shift+e) · right-click: lock now
type = custom/text
format = "%{A1:hemo-power &:}%{A3:hemo-lock &:}%{T2}󰐥%{T-}%{A}%{A}"
format-foreground = ${colors.accent}
format-padding = 1

[settings]
screenchange-reload = true
