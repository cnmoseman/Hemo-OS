# Hemo — core window keys (shipped; safe to overwrite on re-provision).
# The stock i3 essentials, minus anything ~/.config/i3/config already binds
# (hjkl focus/move, launcher, workspaces 1-4). Keep comments on their own line:
# a ';' inside a trailing comment would be run as a second i3 command.

# ── auto-tiling ──────────────────────────────────────────────────────────────
# New windows open next to the focused window, and focus follows the mouse, so
# a new window appears in whichever tile the pointer is over. autotiling then
# splits that tile along its longer side (wide -> side by side, tall -> stacked).
focus_follows_mouse yes
exec_always --no-startup-id sh -c 'pkill -x autotiling; command -v autotiling >/dev/null && exec autotiling'

# ── mouse ────────────────────────────────────────────────────────────────────
# $mod + left-drag moves a floating window, $mod + right-drag resizes it;
# dragging a tiled window by its edge with $mod swaps it around
floating_modifier $mod
tiling_drag modifier

# ── arrow keys mirror hjkl ───────────────────────────────────────────────────
bindsym $mod+Left  focus left
bindsym $mod+Down  focus down
bindsym $mod+Up    focus up
bindsym $mod+Right focus right
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right

# ── window state ─────────────────────────────────────────────────────────────
bindsym $mod+f fullscreen toggle
# float / unfloat the window, and jump focus between floating and tiled
bindsym $mod+Shift+space floating toggle
bindsym $mod+space focus mode_toggle
# focus the parent container (to move or resize a whole group)
bindsym $mod+a focus parent

# ── layout ───────────────────────────────────────────────────────────────────
# manual split for the next window (overrides autotiling once): $mod+v = split below
# ($mod+b "split beside" was moved to the web browser)
bindsym $mod+v split v
# tabbed / stacked / back to split — tabs are handy for many terminals on a small screen
bindsym $mod+w layout tabbed
bindsym $mod+s layout stacking
bindsym $mod+e layout toggle split

# ── scratchpad ───────────────────────────────────────────────────────────────
# stash a window out of sight, and bring it back (press again to hide)
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# ── workspaces ───────────────────────────────────────────────────────────────
# pressing the current workspace's key again returns to the previous one
workspace_auto_back_and_forth yes
bindsym $mod+Tab workspace back_and_forth
# move the window to a workspace and follow it there
bindsym $mod+Ctrl+1 move container to workspace number 1, workspace number 1
bindsym $mod+Ctrl+2 move container to workspace number 2, workspace number 2
bindsym $mod+Ctrl+3 move container to workspace number 3, workspace number 3
bindsym $mod+Ctrl+4 move container to workspace number 4, workspace number 4

# ── helpers ──────────────────────────────────────────────────────────────────
# drop-down terminal: show / hide one persistent terminal over anything
bindsym $mod+grave exec --no-startup-id hemo-dropdown
# searchable list of every key binding (pick one to run it)
bindsym $mod+slash exec --no-startup-id hemo-keyhelp
# window switcher
bindsym Mod1+Tab exec --no-startup-id rofi -show window -theme pinned
# notifications: dismiss, bring back the last one, dismiss all
bindsym $mod+n exec --no-startup-id dunstctl close
bindsym $mod+Shift+n exec --no-startup-id dunstctl history-pop
bindsym $mod+Ctrl+n exec --no-startup-id dunstctl close-all
# Do Not Disturb: pause/resume notifications (screen-share, recording, reporting)
bindsym $mod+Shift+m exec --no-startup-id hemo-dnd
# Caffeine: keep the screen + system awake for long jobs (cracking / scans)
bindsym $mod+Shift+c exec --no-startup-id hemo-caffeine
# Night light: warm screen tint for late sessions (OFF by default)
bindsym $mod+Shift+b exec --no-startup-id hemo-night

# ── resize mode ──────────────────────────────────────────────────────────────
# $mod+r, then hjkl / arrows (Shift = bigger steps); Enter or Esc to leave
mode "resize" {
    bindsym h resize shrink width 30 px or 3 ppt
    bindsym j resize grow height 30 px or 3 ppt
    bindsym k resize shrink height 30 px or 3 ppt
    bindsym l resize grow width 30 px or 3 ppt
    bindsym Left  resize shrink width 30 px or 3 ppt
    bindsym Down  resize grow height 30 px or 3 ppt
    bindsym Up    resize shrink height 30 px or 3 ppt
    bindsym Right resize grow width 30 px or 3 ppt
    bindsym Shift+h resize shrink width 120 px or 12 ppt
    bindsym Shift+j resize grow height 120 px or 12 ppt
    bindsym Shift+k resize shrink height 120 px or 12 ppt
    bindsym Shift+l resize grow width 120 px or 12 ppt
    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}
bindsym $mod+r mode "resize"

# Report mode: snap to the team screenshot standard (font/theme/prompt/opacity),
# toggle again to restore your personal look.
bindsym $mod+p exec --no-startup-id hemo-report toggle
