# Hemo — window look (shipped; safe to overwrite on re-provision).
# No title bars: windows get a thin accent border instead, with gaps between
# them. Colors live in the hemo:colors block of ~/.config/i3/config.

default_border pixel 2
default_floating_border pixel 2
hide_edge_borders none

gaps inner 6
gaps outer 0
# room for the floating polybar: its height (30) + offset-y (6)
gaps top 36
# gaps stay even for a lone window, so it never touches the bar; borders only
# drop when gaps are off (e.g. fullscreen)
smart_gaps off
smart_borders no_gaps

focus_on_window_activation smart
popup_during_fullscreen smart
