# Hemo — window rules (shipped; safe to overwrite on re-provision).
# Float dialogs instead of tiling them full-screen: the hemo-welcome hub and
# its pickers (yad), password prompts, and small settings tools.
for_window [class="(?i)^yad$"] floating enable, border pixel 2
for_window [window_type="dialog"] floating enable
for_window [window_role="(?i)pop-up|dialog|bubble|task_dialog"] floating enable
for_window [class="(?i)lxpolkit|pavucontrol|lxappearance|nm-connection-editor"] floating enable
floating_maximum_size 1280 x 860
# small helper terminals opened from the bar (e.g. nmtui) — class set via `kitty --class hemo-float`
for_window [class="^hemo-float$"] floating enable, resize set 760 520, move position center
# drop-down terminal ($mod+`): wide strip just under the bar, kept in the scratchpad
for_window [class="^hemo-dropdown$"] floating enable, border pixel 2, resize set 80 ppt 45 ppt, move position 10 ppt 42 px, move scratchpad, scratchpad show
# the welcome control center — floats, centered
for_window [class="(?i)^hemo-welcome$"] floating enable, move position center
