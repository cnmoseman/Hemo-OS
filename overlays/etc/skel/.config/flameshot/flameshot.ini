[General]
; Flameshot 14 needs this on i3 — no xdg-desktop-portal, so the portal capture times out
useX11LegacyScreenshot=true
; Hemo — flameshot. Consistent capture + auto-save for reports.
disabledTrayIcon=false
showStartupLaunchMessage=false
showHelp=false
showSidePanelButton=true
showDesktopNotification=false
; auto-save every capture to the engagement folder AND copy to clipboard
saveAfterCopy=true
savePath=/home/hemo/engagements/screenshots
savePathFixed=true
copyAndCloseAfterUpload=true
copyPathAfterSave=true
; consistent filename so report assets sort cleanly
filenamePattern=hemo_%F_%H-%M-%S
; annotation styling in the Hemo accent
uiColor=#e9c24a
contrastUiColor=#1b1714
drawColor=#e9c24a
drawThickness=2
antialiasingPinZoom=true
