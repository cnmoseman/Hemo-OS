# Hemo tmux — a sensible, themed default. Colors live in hemo-colors.conf,
# written by hemo-role-apply (sourced at the end), so the status bar follows the
# active role/accent/mode like every other Hemo app. Edit this file freely; the
# colors file is regenerated and will overwrite its own values only.

# --- terminal / truecolor -------------------------------------------------
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"     # 24-bit color passthrough

# --- behaviour ------------------------------------------------------------
set -g  mouse on
set -g  history-limit 50000                    # deep scrollback for long jobs
set -g  base-index 1                           # windows start at 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -sg escape-time 10                         # don't swallow Esc in vim/nvim
set -g  focus-events on
set -g  set-clipboard on

# --- status bar -----------------------------------------------------------
set -g  status-interval 5
set -g  status-left  " #S #(e=$(hemo-engagement path 2>/dev/null) && printf '@%s ' $(basename \"$e\")) "
set -g  status-left-length 50
set -g  status-right " %Y-%m-%d %H:%M "
setw -g window-status-format         " #I #W "
setw -g window-status-current-format " #I #W "

# --- engagement logging (built-in pipe-pane; no plugin) -------------------
# prefix + H toggles a transcript of the current pane. Saved under the active
# engagement's tmux-logs/, else ~/engagements/tmux-logs/. The sink
# (hemo-tmux-log) re-reads the active engagement per line, so switching
# engagements mid-session routes further output to the new one's log without
# re-toggling. Raw terminal output — evidence-grade but may hold secrets
# printed to screen; toggle it off before anything sensitive.
bind H if-shell -F '#{pane-pipe}' \
  'pipe-pane ; display-message "tmux logging: OFF"' \
  'pipe-pane -o "hemo-tmux-log #S #W" ; display-message "tmux logging: ON"'

# --- reload ---------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- theme (generated; quiet if not yet written) -------------------------
source-file -q ~/.config/tmux/hemo-colors.conf
