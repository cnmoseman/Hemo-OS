# hemo-open — spatial launcher config. System defaults for Hemo OS.
#
# Precedence: ~/.config/hemo/open.conf (user) > this file > built-in defaults.
# One key=value per line. Blank lines and `#` comments are ignored.
# Env overrides (HEMO_NO_OPEN=1, HEMO_OPEN_DEBUG=1) win over both files.
#
# Run `hemo-open --help` for the full option list.

# Enable the spatial launcher. 0 = plain exec passthrough (same effect as
# setting HEMO_NO_OPEN=1 in the environment).
enabled=1

# How aggressively to pick a horizontal (sides) vs vertical (stacks) split
# when the pointer is near the centre of the focused tile:
#
#   balanced  Midline model. Whichever axis the pointer is more off-centre
#             on wins. Being in the left half → LEFT; near the top edge → TOP.
#             Scale-free (works on wide and tall tiles). This is the default.
#   sides     Prefer horizontal. Picks a vertical split only when the pointer
#             sits in the top 30 % or bottom 30 % strip of the focused tile.
#   stacks    Prefer vertical. Picks a horizontal split only when the pointer
#             sits in the left 30 % or right 30 % strip.
bias=balanced

# Window classes to IGNORE when the post-move subscription catches a
# window::new event, so a transient launcher menu doesn't trigger the move
# and the real app that it spawns gets moved instead. Comma-separated.
# Matched case-insensitively as a substring, so "rofi" matches "Rofi".
skip_classes=rofi,dmenu,lxpolkit

# How long to SIGSTOP `autotiling` for during the critical section (ms).
# autotiling listens to the same window::focus event hemo-open uses, so
# both race to send i3 the next `split h/v` and the last one in wins. The
# background sh helper (`pkill -STOP ...; sleep N; pkill -CONT ...`) suspends
# autotiling for this long, then always resumes it. Set to 0 to skip the
# pause (autotiling may then override hemo-open's split direction).
autotiling_pause_ms=1000

# How long the parent process waits on a window::new event after fork+exec
# before giving up on the post-move (seconds). Needs to cover the launched
# app's cold start — Firefox and the first run of a browser can take a few
# seconds; a terminal is almost instant.
post_move_timeout_s=5
