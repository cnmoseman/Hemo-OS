# Hemo prompt: timestamped — [HH:MM:SS] user@host folder ❯ (for reports/logs).
# Chosen in Appearance > Prompt; edit freely (picking a prompt again overwrites).
add_newline = false
format = "${custom.engagement}$time$username$hostname $directory$character"

[custom.engagement]
description = "Active Hemo engagement (slug)"
command = "basename \"$(hemo-engagement path 2>/dev/null)\""
when = "hemo-engagement path >/dev/null 2>&1"
format = "[@$output]($style) "
style = "bold accent"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[\\[$time\\]]($style) "
style = "muted"

[username]
show_always = true
format = "[$user]($style)"
style_user = "bold accent"

[hostname]
ssh_only = false
format = "[@](dimmed)[$hostname](bold accent)"

[directory]
format = "[$path]($style) "
