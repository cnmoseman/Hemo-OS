# Hemo prompt: kali — Kali's classic two-line prompt.
# Chosen in Appearance > Prompt; edit freely (picking a prompt again overwrites).
add_newline = false
format = """${custom.engagement}[┌──\\(](ok)$username[㉿](bold accent)$hostname[\\)-\\[](ok)$directory[\\]](ok)
[└─](ok)[\\$](bold accent) """

[custom.engagement]
description = "Active Hemo engagement (slug)"
command = "basename \"$(hemo-engagement path 2>/dev/null)\""
when = "hemo-engagement path >/dev/null 2>&1"
format = "[@$output]($style) "
style = "bold accent"

[username]
show_always = true
format = "[$user](bold accent)"

[hostname]
ssh_only = false
format = "[$hostname](bold accent)"

[directory]
format = "[$path](bold)"
truncation_length = 5
