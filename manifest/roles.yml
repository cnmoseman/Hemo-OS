# Hemo — persona roles for the first-boot picker (Athena-style).
#
# MODEL (decided 2026-10-02):
#   - Picker pops up on FIRST BOOT of a fresh clone (firstboot/ oneshot).
#   - Tools install ONLINE at selection time (offline cache is a later mode).
#   - Multi-select: every ticked role installs its tools. The FIRST role you
#     select is your PRIMARY — it alone drives wallpaper / accent / bookmarks.
#     Theme is changeable later (`hemo-theme <role>`), more roles
#     installable later (`hemo-roles`).
#
# SCOPE NOTE: this set is FULL-SPECTRUM (purple) — offensive + defensive (blue)
#   + vuln assessment. Cloud / AD / OSINT / Cracker are no longer standalone
#   roles; their tools fold into Penetration Testing and Full.
#
# RESOLUTION: each `tools:` name must exist in manifest/apt.yml or extra.yml;
#   the installer resolves method (apt/pipx/go/git/binary/build) + pin from there.
#
# PROFILE: accent (hex) / wallpaper (branding/assets/, falls back to hemo-bg.png)
#   / bookmarks (policies.json folders to surface). Workspaces are plain 1-4
#   for every role (static in i3/config), so they're not part of a profile.

base_always:
