# Hemo — apt packages (from the Kali repo), grouped by purpose.
# Package names are Kali/Debian names; a few are flagged where the binary
# or package name differs from the tool's common name.
#
# BAKED vs CATALOG (role-install model, 2026-10-02): only `base` + `desktop_i3`
# + `desktop_apps` + `plumbing` + `runtime` + `hardening` + `branding` are baked
# into the image via kali-vm -P (see build.sh, which reads exactly these
# sections). Every other section is a CATALOG the first-boot role installer draws
# from (see roles.yml); those tools install ONLINE when a role is selected.

base:
  - build-essential       # toolchain/headers so source-built pipx wheels (lxml, crypto…) compile
  - python3-dev
  - libxml2-dev
  - libxslt1-dev
  - libssl-dev
  - libffi-dev
  - pkg-config
  - cargo
  - zsh
  - zsh-autosuggestions    # grey history ghost-text, accept with → (Kali default; lost when Hemo replaced .zshrc)
  - zsh-syntax-highlighting # live green/red command highlighting (Kali default)
  - powershell             # pwsh: the $mod+Shift+Return terminal (hemo-pwsh); base on every system
  - goshs                  # quick file-transfer server (hemo-serve): HTTP/HTTPS/WebDAV/SMB + upload
  - minisign               # verify release downloads (hemo-verify)
  - nano                   # default $EDITOR + root/visudo; setup can switch $EDITOR to vim (= Neovim)
  - tmux
  - fzf
  - ripgrep
  - bat            # binary is `batcat`
  - fd-find        # binary is `fdfind`
  - git
  - pipx
  - golang         # Go toolchain for the go-installed tools in extra.yml
  - curl
  - wget
  - jq
  - pandoc
  - keepassxc
  - neovim         # default code editor; LazyVim config ships in skel, plugins bootstrap at setup (hemo-lazyvim)
  # Guest integration — ALL baked so one image works on any hypervisor; only the
  # daemon matching the detected host activates (clipboard, drag-drop, resize).
  - open-vm-tools          # VMware daemon
  - open-vm-tools-desktop  # VMware clipboard / drag-drop / auto-resize (X integration)
  - qemu-guest-agent       # KVM/QEMU
  - spice-vdagent          # QEMU/SPICE clipboard + resize
  - virtualbox-guest-x11   # VirtualBox clipboard + resize (X); confirm pkg name in snapshot

desktop_i3:
  - rofi
  - polybar
  - dunst
  - kitty                   # baked DEFAULT terminal + report/screenshot terminal (hemo-shotterm, Welcome build windows)
  - qterminal               # NOT baked — installable on demand via Welcome "Apps & tools" (hemo-pkg install qterminal); listed here so hemo-pkg can resolve it. Picking it removes kitty.
  - flameshot
  - firefox-esr
  - autorandr
  - feh                    # wallpaper setter (hemo-role-apply uses it) + quick image view
  - x11-xserver-utils      # xrandr/xset etc. the i3 config assumes
  - picom                  # compositor (i3 execs `picom -b`); shadows/fade, no tearing
  - i3lock-color           # screen lock via hemo-lock ($mod+Shift+x); provides i3lock
  - xss-lock               # auto-lock on idle + before suspend (bridges i3lock to logind)
  - autotiling             # splits each new window along the focused tile's longer side
  - python3-i3ipc          # hemo-open's post-move (window::new); autotiling pulls it too, but don't rely on that
  - kali-themes-common     # Flat-Remix icons: launcher, tray, Thunar (GTK icon theme)
  - fonts-font-awesome     # icon glyphs for polybar modules (font-1)
  # report/screenshot consistency: fixed font + window capture + framing
  - fonts-jetbrains-mono   # fixed terminal font so screenshots match
  - maim                   # window/region capture (used by `shot`)
  - xdotool                # active-window id (used by `shot`)
  - xclip                  # copy image to clipboard
  - imagemagick            # consistent border + fixed width (used by `shot`)
  # obsidian, starship: see extra.yml (not in Kali repo). vscodium is opt-in at setup (extra.yml)

# ---- Desktop apps & daily-driver QoL (BAKED) --------------------------------
