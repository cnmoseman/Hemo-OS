# ---- Container runtime (BAKED) — heavy services run as idle Docker stacks ----
# BloodHound CE (hemo-bloodhound), Arkime (hemo-arkime), the log-analytics stack
# (hemo-elk: OpenSearch+Dashboards by default, or Elasticsearch+Kibana), and future
# services. Installed in the base so the service helpers work out of the box; no
# container is started or image pulled at build time (all are idle-until-invoked).
runtime:
  - docker.io              # the Docker daemon only (the `docker` CLI is docker-cli)
  - docker-cli             # the `docker` command — docker.io only *Recommends* it
  - docker-compose         # Compose v2 (`docker compose`) — AdaptixC2 + BloodHound need it
  - docker-buildx          # `docker buildx` only (does NOT provide compose)

# ---- OS hardening (BAKED into the thin core; some bits operator-toggled) ----
# Adapted from Athena OS's posture, but tuned so it NEVER fights offensive work.
# Split (see hemo-harden + provision.sh):
#   ALWAYS-ON (safe for an ops box): AppArmor enabled, bubblewrap on the BROWSER
#     only, and low-risk sysctls (dmesg_restrict, kptr_restrict).
#   OPERATOR-TOGGLED via `hemo-harden on|off`, OFF by default because they fight
#     callback-catching / MITM in a VM: ufw default-deny inbound,
#     stricter net sysctls (rp_filter, source-route/redirect drop).
#   DEFERRED to the persistent-install / ISO path (NOT here): LUKS2 FDE,
#     Secure Boot + signed UKI, TPM2 measured boot.
# NOTE: ptrace_scope is deliberately NOT restricted — it would break gdb/pwndbg.
hardening:
  - apparmor                 # MAC; Kali kernel already supports it — we enable it
  - apparmor-utils
  - bubblewrap               # browser sandbox (bwrap). The /usr/local/bin/firefox-esr wrapper
                             # (overlays/) relaunches Firefox inside bwrap; it self-degrades to a
                             # normal launch if bwrap is absent or HEMO_NO_SANDBOX=1. Reliable in
                             # apt (unlike firejail, which drifts in/out of Debian testing).
  - ufw                      # firewall — INSTALLED but left disabled (hemo-harden on)
  - auditd                   # basic audit logging

