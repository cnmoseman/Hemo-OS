  # removable + network media mounting
  - gvfs
  - gvfs-backends
  - udisks2
  - ntfs-3g
  - exfatprogs
  - cifs-utils             # mount.cifs for SMB shares (evidence / loot)
  # appearance + fonts
  - lxappearance           # set the GTK dark theme consistently (thunar/pavucontrol/libreoffice)
  - fonts-noto
  - fonts-noto-color-emoji
  - fonts-nerd-symbols     # Nerd Font glyph fallback for polybar/starship icons (confirm in snapshot; sid/forky). Patched JetBrainsMono Nerd Font is vendored for exact alignment.
  # clipboard / automount / viewer / night-light — i3-native QoL
  - copyq                  # clipboard manager (GUI + searchable history); greenclip is the rofi-native default (vendored)
  - udiskie                # auto-mount removable media + tray + notifications (udisks2 frontend for a no-DE i3)
  - nsxiv                  # fast image/screenshot gallery viewer (thumbnail grid + vim keys)
  - gammastep              # night-light / blue-light filter (maintained redshift fork; X11+Wayland)
  # first-run setup hub (hemo-welcome, Python/GTK3) + a polkit agent for its pkexec prompts
  - python3-gi             # Python GTK3 bindings — the hemo-welcome control center
  - gir1.2-gtk-3.0         # GTK3 typelib for python3-gi
  - gir1.2-gdkpixbuf-2.0   # pixbuf typelib (the welcome header logo)
  - python3-pil            # Pillow — hemo-net-icons renders the accent nm-applet tray glyphs at login
  - yad                    # lightweight GTK dialogs (used by misc scripts)
  - lxpolkit               # lightweight polkit auth agent (pkexec password dialogs under i3).
                           # The tray-toggle binary `gammastep-indicator` ships INSIDE this package
                           # (not a separate apt pkg); it needs gir1.2-ayatanaappindicator3-0.1 to show a tray icon.
  # office — read/write client docs (user chose to bake it)
  - libreoffice-writer
  - libreoffice-calc
  - libreoffice-impress
  - libreoffice-gtk3       # GTK integration so it follows the dark theme
  # engagement notes — Obsidian is the single baked default (extra.yml; provision.sh installs it
  # via hemo-pkg, and hemo-welcome-apply on the image path). Cherrytree is catalogued here only so
  # it's installable on demand (Welcome > Apps & tools, or HEMO_NOTES=cherrytree|both at provision);
  # it is NOT baked by default. Keep this entry so `hemo-pkg install cherrytree` resolves.
  - cherrytree             # offline hierarchical notes: inline screenshots, code highlight, 1-file PDF/HTML export (OSCP-ready)
  # NetworkManager VPN plugins — reach a CLIENT network over their VPN, GUI via nm-applet
  - network-manager-openconnect-gnome  # Cisco AnyConnect / GlobalProtect / Pulse — the most common client SSL VPNs
  - network-manager-openvpn-gnome
  - network-manager-vpnc-gnome         # Cisco legacy IPsec / IKEv1
  # Fortinet SSL VPN: network-manager-fortisslvpn-gnome is NOT in all Kali snapshots
  # (present in Debian sid/bookworm, was absent from testing). Add when available:
  #   sudo apt install network-manager-fortisslvpn-gnome
  - network-manager-l2tp-gnome
  - network-manager-strongswan         # IKEv2 IPsec (ships its own GUI; no -gnome pkg)
  # report generation — pandoc (base) + a reliable XeLaTeX subset + an HTML/CSS path.
  # (Optional modern engine: typst — LaTeX-free, NOT in apt; vendor the release binary if wanted.)
  - texlive-xetex          # xelatex engine for pandoc->PDF (Unicode + font control)
  - texlive-latex-recommended
  - texlive-latex-extra     # packages pandoc's default template pulls in
  - texlive-fonts-recommended
  - lmodern
  - weasyprint             # HTML/CSS -> PDF path (SysReptor-style); lighter than full texlive

