# Per-role overrides — used only when exactly one of these roles is being
# installed. Keep every one of that role's tools listed here; anything missed
# still falls through to "Setup & tooling". These are the groupings a specialist
# in that role would recognize.
role_phases:

  reverse:
    - name: "Disassembly"
      tools:
        - ghidra
        - radare2
        - rizin
        - rizin-cutter
        - python3-ropgadget
    - name: "Debug & trace"
