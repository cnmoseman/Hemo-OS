# Install-panel phases
#
# Groups a role's tools under security-work phases while they install, so the
# Hemo Welcome terminal shows a redraw-in-place panel (progress bar + current
# tool + per-phase tally) instead of a scrolling list. The order here is the
# panel's display order; a role only ever shows the phases its own tools touch.
#
# This is PRESENTATION ONLY. It changes nothing about what installs or how — a
# tool not listed here falls into "Setup & tooling" at the end, so an unmapped
# name is harmless. A tool should appear under at most one phase; where a tool is
# dual-use (e.g. binwalk, yara), it's filed under the phase it most often serves.
# Refine freely: this file is read by hemo-pkg's panel, nothing else.
#
# `phases:` below is the default (offensive-leaning) grouping used for red_team,
# pentest, web, vuln_assessor, and any multi-role install. `role_phases:` further
# down overrides it for a SINGLE-role install of a role listed there (reverse,
# blue_host, blue_net), so a reverse box shows disassembly/debug/triage rows
# instead of one lumped "Reversing", and a blue box shows real DFIR sub-phases.

